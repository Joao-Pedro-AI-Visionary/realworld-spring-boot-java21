services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: oss-realworld-app:local
    container_name: oss-realworld-app
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (see .env.example)}
      SPRING_DATASOURCE_URL: jdbc:sqlite:/app/data/dev.db
    volumes:
      - app-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped

volumes:
  app-data:
