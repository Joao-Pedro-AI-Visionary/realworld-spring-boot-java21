# Render Blueprint: https://render.com/docs/blueprint-spec
# Free plan: 512 MB RAM, ephemeral disk (the SQLite file resets on every deploy, restart
# or spin-down). See docs/DEPLOY-API.md.
services:
  - type: web
    name: realworld-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    envVars:
      # Random base64 256-bit value generated by Render on first deploy, never stored in git.
      # 44 chars = 44 bytes, so jjwt picks HS256 (HS512 needs 64+ bytes). For HS512, see
      # docs/DEPLOY-API.md (replace it with a 64+ char value in the dashboard).
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://realworld-conduit-vue.vercel.app,https://*.vercel.app
      # The Dockerfile entrypoint already sets -XX:MaxRAMPercentage=75.
      - key: JAVA_OPTS
        value: -XX:+UseSerialGC -Xss512k -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -XX:TieredStopAtLevel=1
      # Spring Boot listens on 8080; tell Render to route there instead of its default 10000.
      - key: PORT
        value: "8080"
