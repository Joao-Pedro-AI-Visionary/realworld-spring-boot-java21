<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Conduit</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7878FF"/>
      <stop offset="0.55" stop-color="#5B5BF7"/>
      <stop offset="1" stop-color="#3F35D9"/>
    </linearGradient>
  </defs>
  <!-- Fundo sangrando ate a borda; o desenho fica dentro do circulo seguro (raio 40% = 204.8px). -->
