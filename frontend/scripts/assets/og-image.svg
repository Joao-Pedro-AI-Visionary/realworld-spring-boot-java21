<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glowA" cx="0.15" cy="0.1" r="0.75">
      <stop offset="0" stop-color="#5B5BF7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5B5BF7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.92" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7878FF"/>
      <stop offset="0.55" stop-color="#5B5BF7"/>
      <stop offset="1" stop-color="#3F35D9"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1E2B"/>
      <stop offset="1" stop-color="#141722"/>
    </linearGradient>
    <linearGradient id="avatar1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="avatar2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="avatar3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0B0D12"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>

  <!-- Marca -->
  <g transform="translate(80 92)">
    <rect width="72" height="72" rx="17" fill="url(#logo)"/>
    <g transform="scale(0.140625)">
      <path d="M 340.85 171.15 A 120 120 0 1 0 340.85 340.85" fill="none" stroke="#FFFFFF" stroke-width="58" stroke-linecap="round"/>
      <circle cx="376" cy="256" r="30" fill="#C7D2FE"/>
    </g>
    <text x="92" y="47" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#A5B4FC" letter-spacing="3">REALWORLD</text>
  </g>

  <!-- Titulo e subtitulo -->
  <text x="76" y="300" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="112" font-weight="700" fill="url(#title)" letter-spacing="-3">Conduit</text>
  <text font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="30" fill="#C9CEDC">
    <tspan x="80" y="368">Um lugar para escrever e ler</tspan>
    <tspan x="80" y="410">histórias.</tspan>
  </text>

  <!-- Chips da stack -->
  <g font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="600">
    <g transform="translate(80 462)">
      <rect width="112" height="44" rx="22" fill="#5B5BF7" fill-opacity="0.18" stroke="#5B5BF7" stroke-opacity="0.7"/>
      <text x="56" y="29" text-anchor="middle" fill="#C7D2FE">Vue 3</text>
    </g>
    <g transform="translate(204 462)">
      <rect width="196" height="44" rx="22" fill="#34D399" fill-opacity="0.12" stroke="#34D399" stroke-opacity="0.6"/>
      <text x="98" y="29" text-anchor="middle" fill="#A7F3D0">Spring Boot 3.5</text>
    </g>
    <g transform="translate(412 462)">
      <rect width="118" height="44" rx="22" fill="#F97316" fill-opacity="0.12" stroke="#F97316" stroke-opacity="0.6"/>
      <text x="59" y="29" text-anchor="middle" fill="#FED7AA">Java 21</text>
    </g>
  </g>

  <!-- Mock de cards de artigo -->
  <g transform="translate(655 64) rotate(-4 220 240)">
    <!-- card de tras -->
    <g transform="translate(40 0)" opacity="0.55">
      <rect width="420" height="150" rx="22" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <circle cx="44" cy="44" r="18" fill="url(#avatar3)"/>
      <rect x="74" y="34" width="120" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.5"/>
      <rect x="74" y="52" width="70" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.2"/>
      <rect x="26" y="88" width="300" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.35"/>
      <rect x="26" y="112" width="220" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.15"/>
    </g>
    <!-- card do meio -->
    <g transform="translate(0 130)" opacity="0.85">
      <rect width="440" height="170" rx="22" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <circle cx="46" cy="46" r="20" fill="url(#avatar2)"/>
      <rect x="78" y="34" width="130" height="11" rx="5.5" fill="#FFFFFF" fill-opacity="0.6"/>
      <rect x="78" y="54" width="80" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.22"/>
      <rect x="352" y="30" width="62" height="32" rx="16" fill="#5B5BF7" fill-opacity="0.2" stroke="#5B5BF7" stroke-opacity="0.6"/>
      <rect x="28" y="92" width="330" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.45"/>
      <rect x="28" y="120" width="260" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.18"/>
      <rect x="28" y="140" width="200" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.12"/>
    </g>
    <!-- card da frente -->
    <g transform="translate(30 290)">
      <rect width="460" height="200" rx="24" fill="url(#card)" stroke="#5B5BF7" stroke-opacity="0.55" stroke-width="1.5"/>
      <circle cx="50" cy="50" r="22" fill="url(#avatar1)"/>
      <rect x="84" y="38" width="140" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.8"/>
      <rect x="84" y="58" width="90" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.3"/>
      <g transform="translate(360 30)">
        <rect width="74" height="38" rx="19" fill="#5B5BF7"/>
        <path d="M 22 19 c -4 -6 -12 -3 -10 3 c 1 4 10 10 10 10 c 0 0 9 -6 10 -10 c 2 -6 -6 -9 -10 -3 z" fill="#FFFFFF"/>
        <rect x="40" y="14" width="20" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.9"/>
      </g>
      <rect x="30" y="100" width="360" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.85"/>
      <rect x="30" y="130" width="300" height="11" rx="5.5" fill="#FFFFFF" fill-opacity="0.28"/>
      <rect x="30" y="150" width="240" height="11" rx="5.5" fill="#FFFFFF" fill-opacity="0.2"/>
      <rect x="300" y="160" width="60" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.2"/>
      <rect x="370" y="160" width="62" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.2"/>
    </g>
  </g>

  <text x="80" y="572" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="20" fill="#8B93A7">realworld-conduit-vue.vercel.app</text>
</svg>
