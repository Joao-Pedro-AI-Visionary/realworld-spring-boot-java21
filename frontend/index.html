<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Tema aplicado antes de qualquer CSS para evitar flash (FOUC de tema). -->
    <script>
      (function () {
        var theme = 'light'
        try {
          var saved = localStorage.getItem('conduit.theme')
          if (saved === 'light' || saved === 'dark') {
            theme = saved
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark'
          }
        } catch (e) {
          /* localStorage indisponivel: segue com o padrao do sistema */
        }
        document.documentElement.setAttribute('data-theme', theme)
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Conduit: histórias de quem constrói software</title>
    <meta name="description" content="Conduit é uma comunidade para publicar, ler e discutir artigos sobre desenvolvimento de software." />

    <meta name="theme-color" content="#0B0D12" media="(prefers-color-scheme: dark)" />
